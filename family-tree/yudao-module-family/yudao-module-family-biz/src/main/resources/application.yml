spring:
  application:
    name: family-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: root
    password: root

  redis:
    host: 127.0.0.1
    port: 6379

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848

server:
  port: 48080

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: cn.iocoder.yudao.module.family.dal.dataobject

# Coze AI 配置
family:
  coze:
    api-key: ${COZE_API_KEY:}
    bot-id: ${COZE_BOT_ID:}
    api-url: https://api.coze.cn/open_api/v2/chat

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn
